<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Running</title>
  <script>(function () { try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { } })()</script>
  <link rel="stylesheet" href="theme.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap');

    :root {
      /* Bridge theme.css tokens → local aliases */
      --bg: var(--bg-page);
      --surface: var(--bg-card);
      --surface2: var(--bg-sunken);
      --border: var(--border-soft);
      --text: var(--text-strong);
      --muted: var(--text-muted);
      /* Sport accent colours — same in both modes */
      --race: #b02040;
    }

    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 100;
      font-family: 'DM Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      padding: 2rem 1.2rem 4rem;
      font-size: 112%;
      max-width: 720px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(135deg, #1a1a1f 0%, #2a1a25 100%);
      color: #f5f4f0;
      border-radius: 12px;
      padding: 1.8rem 1.5rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 60%;
      height: 200%;
      background: radial-gradient(circle, #b0204022 0%, transparent 60%);
    }

    .hero-label {
      font-size: .68rem;
      letter-spacing: .25em;
      color: #b02040;
      text-transform: uppercase;
      margin-bottom: .5rem;
      position: relative;
    }

    .hero-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.8rem, 9vw, 4.5rem);
      letter-spacing: .04em;
      line-height: .9;
      color: #fff;
      position: relative;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .9rem 1.1rem;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
      transition: border-color .15s, box-shadow .15s;
      border-left: 4px solid var(--border);
    }

    .link-card:hover {
      border-left-color: var(--race);
      box-shadow: 0 2px 8px rgba(176, 32, 64, .1);
    }

    .link-icon {
      font-size: 1.3rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .link-info {
      display: flex;
      flex-direction: column;
      gap: .15rem;
      flex: 1;
      min-width: 0;
    }

    .link-name {
      font-size: .82rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
    }

    .link-desc {
      font-size: .64rem;
      color: var(--muted);
    }

    .link-arrow {
      font-size: .7rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <button class="theme-toggle" onclick="toggleTheme()"><span class="sun">☀</span><span class="moon">☾</span></button>

  <div class="hero">
    <div class="hero-label">Nicolás Cornaglia</div>
    <div class="hero-name">RUNNING</div>
  </div>

  <div class="links">
    <a class="link-card" href="dements-2026-plan.html">
      <div class="link-icon">🏔</div>
      <div class="link-info">
        <div class="link-name">Dements 2026 — Race Plan</div>
        <div class="link-desc">Marató dels Dements · Skyrunner World Series Final · Nov 7 2026</div>
      </div>
      <div class="link-arrow">›</div>
    </a>
    <a class="link-card" href="running-zones.html">
      <div class="link-icon">📊</div>
      <div class="link-info">
        <div class="link-name">Running Zones</div>
        <div class="link-desc">Heart rate and pace training zones</div>
      </div>
      <div class="link-arrow">›</div>
    </a>
    <a class="link-card" href="gimnasio-semana3-5.html">
      <div class="link-icon">🏋️</div>
      <div class="link-info">
        <div class="link-name">Gimnasio — Semana 3–5</div>
        <div class="link-desc">Gym strength training programme, current block</div>
      </div>
      <div class="link-arrow">›</div>
    </a>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('theme', html.dataset.theme); } catch (e) { }
    }
  </script>
</body>

</html>
